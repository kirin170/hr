goals:
- id: ats-delivery
  status: active
  title: 交付覆盖招聘全流程、可审计且可运维的 TalentFlow 招聘管理系统
  success_criteria:
  - 以职位和招聘需求为业务起点，覆盖简历入场、九阶段候选人主链、面试、Offer、入职、试用期与人才复用，并支持社招、校招和内推。
  - 基于 React 18/Vite/TypeScript、NestJS/Prisma/MySQL、Redis/BullMQ 的冻结技术栈，核心页面使用真实 API 和持久化数据。
  - 钉钉六类用途、邮箱、AI 三场景和浏览器插件按需求完成正式适配与授权环境验证；Mock 只作为阶段演示和测试手段。
  - 角色、部门数据范围、敏感字段与附件独立授权、审计、生命周期和访问日志符合 PRD §2/§8 的边界。
  - 工作台和报表指标来自权限内真实数据、可复算且可下钻，需求级招聘周期口径可追溯。
  - 必需功能与非功能需求有验收证据，类型、测试、构建、迁移、性能、备份恢复和发布回滚通过检查，并由指定业务验收人完成验收。
  summary: "2026-11-13 按用户要求将原先“后端与 Mock 首版”目标扩展为全项目目标规划；Mock 首版是里程碑，不代表最终交付。\n权威需求：docs/ats-功能需求文档-v1.2.md；docs/ats-PRD-v1.0.md（文件名 v1.0，正文版本 v1.1）；技术设计冻结结论见 docs/ats-技术设计与开发环境-v1.0.md §0.2。\n全项目路线图：docs/ats-项目目标与实施路线图-v1.0.md。下列八个领域目标共同服务总目标，目标达成需关联任务证据，不能由实现存在或状态文本推断。\n用户明确指示：规划完成后不自动执行任务，由用户进行任务分配。新增任务均 planned、owner=null；不自动领取、启动、接续业务任务，不执行历史待应用完成提案。\n当前只授权本次规划与 AWR 登记；未来业务执行须有用户明确分配。规划顺序与依赖不构成执行授权，计划不含未经确认的工期与上线日期。\n历史基线曾为纯前端原型；目前 backend/ 和候选人/职位 API 已存在，ATS-001～003 有历史本地报告；ATS-002 已于 2026-11-13 按用户确认及原验收报告同步为 completed。\nREADME 的纯前端/localStorage 说明过期，已登记 ATS-026；历史 INTAKE-001 证据不足保留，不能补造旧验收。\n正式需求包括九阶段、权限与运维；原型六阶段、自建审批、试用期绩效并非最终业务范围。功能需求正文为业务基线；剩余待确认项见功能需求 §7.1 和 PRD §11。\n2026-11-20 用户把任务分派权交给 Claude Code，并说明本机可用编程智能体为 Codex、CodeBuddy、Trae。据此对 ATS-010～026 中 15 个未完成任务登记负责人与批次，分派方案见 docs/ats-任务分派-v1.0.md。\n分派只改变负责人和下一步，不改变状态：全部仍为 planned，由各智能体在依赖满足后自行领取会话执行；批次是依赖顺序，不是工期或上线日期承诺。\n第1批（依赖已满足，可立即启动）：ATS-012→Codex、ATS-022→CodeBuddy、ATS-010→Trae。后续批次为预派，依赖未满足前不启动；用户可随时改派。"
- id: ats-foundation
  status: active
  title: "建立可持续开发与受控访问的工程基础"
  success_criteria:
  - "真实数据持久化、候选人/职位 API 与审计链可验证，工程启动文档与实现一致。"
  - "身份、角色、部门范围及敏感字段权限在服务端校验；文件私有访问、生命周期与 CI 门禁具备证据。"
  summary: "归属总目标 ats-delivery；依据 PRD §2/§3/§8；技术设计 §2/§9/§11/§13。对应任务见项目路线图；仅规划，执行由用户分配。"
- id: ats-requisition
  status: active
  title: "打通职位、招聘需求和招聘周期管理"
  success_criteria:
  - "职位管理与 HC 分离，OA 需求同步幂等；开始、关闭、回退和周期计算遵守 REQ-0～4。"
  - "周期按招聘需求计算且可追溯、可筛选，职位变动不改变已计算周期。"
  summary: "归属总目标 ats-delivery；依据 PRD §4.4/§5.2/§5.2.1；FR-JOB、FR-REQ。对应任务见项目路线图；仅规划，执行由用户分配。"
- id: ats-intake
  status: active
  title: "统一各类简历入口并形成可确认的候选人档案"
  success_criteria:
  - "邮箱、上传、手工、Excel、校招门户及浏览器插件均接入统一查重、分配与时间线规则；内推仅记录推荐人/来源标识，不判定有效推荐、不自动结算。"
  - "解析草稿全部经人工确认后转正式，高置信度也不自动转正式；失败可降级重试，重复请求不产生重复候选人；个人意愿不被职位分配覆盖。"
  summary: "归属总目标 ats-delivery；依据 PRD §3.5/§5.1/§5.8/§5.12/§6.4。对应任务见项目路线图；仅规划，执行由用户分配。"
- id: ats-candidate-flow
  status: active
  title: "实现九阶段候选人主链和人才复用"
  success_criteria:
  - "待分配、九阶段、归档的列表与详情使用真实 API，状态流转受条件校验并可撤销、可审计。"
  - "用人部门任一 PASS 按规则推进；归档入池、激活回流、万级分页与 1w+ 展示符合需求。"
  summary: "归属总目标 ats-delivery；依据 PRD §4.1/§4.3/§5.3/§5.7。对应任务见项目路线图；仅规划，执行由用户分配。"
- id: ats-interview
  status: active
  title: "完成面试协同、评价和日历联动"
  success_criteria:
  - "多轮多人排期、改期、取消、登记表、代填标识、评价互看与分轮听记均可追溯。"
  - "日历邀请与接受占用区分明确；冲突仅提示，拒绝可改期，评价结论不自动推进候选人。"
  summary: "归属总目标 ats-delivery；依据 PRD §5.4/§7；FR-INT、DT-3/DT-4。对应任务见项目路线图；仅规划，执行由用户分配。"
- id: ats-offer-onboarding
  status: active
  title: "闭环 Offer、背调、待入职与试用期"
  success_criteria:
  - "Offer 六阶段及各阶段接受/不通过子状态、OA 材料、谈薪结果、背调审批与书面 Offer 发送/接受结果可跟踪，不保存薪资明细；集 A/B/C 原因独立记录和统计。"
  - "待入职要求书面 Offer 接受、入职时间及已发送标记齐备；确认/放弃入职、HC 回写与是否转正可验证；保温只提醒内部人事。"
  summary: "归属总目标 ats-delivery；依据 PRD §4.2/§5.5/§5.6；SEC-F1～4。对应任务见项目路线图；仅规划，执行由用户分配。"
- id: ats-integrations
  status: active
  title: "将接口化 Mock 演进为可用的正式集成"
  success_criteria:
  - "钉钉六类用途、邮箱附件获取与 AI 三场景在授权环境验证，契约、幂等、失败重试和人工兜底有证据。"
  - "AI 采用钉钉/通义优先 + 外部模型兜底，全部结果人工确认后转正式，高置信度也不自动转正式；不作审批结论、不自动流转；第三方失败不阻断人工主流程。"
  summary: "归属总目标 ats-delivery；依据 PRD §5.9/§6/§7；AI-1～8、DT-1～6。对应任务见项目路线图；仅规划，执行由用户分配。"
- id: ats-operations
  status: active
  title: "交付可度量、可配置、可运维的上线系统"
  success_criteria:
  - "工作台与报表使用受权限约束的真实数据，指标可下钻；招聘周期按需求级汇总且排除未关闭需求。"
  - "配置项、万级性能、日志审计、备份恢复、数据生命周期、发布回滚及业务验收均具备记录。"
  summary: "归属总目标 ats-delivery；依据 PRD §5.10/§5.11/§8/§9；技术设计 §11～§16。对应任务见项目路线图；仅规划，执行由用户分配。"
